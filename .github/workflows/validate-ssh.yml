name: Validate SSH onboarding
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/ssh-onboarding.mjs', 'tests/ssh-*', 'src/pages/nodes/**', '.github/workflows/validate-ssh.yml']
permissions:
  contents: read
jobs:
  web:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run test:server
      - run: npm run test:i18n
  ssh-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: n-ycta/delta
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: cargo build --locked --manifest-path core/Cargo.toml
      - run: node tests/ssh-onboarding-live.mjs
        env:
          DELTA_TEST_BINARY: ${{ github.workspace }}/core/target/debug/delta
